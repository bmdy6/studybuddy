services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-studybuddy_oss}
      MYSQL_USER: ${DB_USER:-studybuddy}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your backend environment file}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - studybuddy_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  studybuddy_db:
