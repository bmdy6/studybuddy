name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_DATABASE: studybuddy_ci_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: synthetic-ci-password
      DB_NAME: studybuddy_ci_test
      JWT_SECRET: synthetic-ci-jwt-secret-not-for-deployment
      STUDYBUDDY_TEST_DATABASE: "1"
      PYTHONPATH: .
      WECHAT_ENABLED: "true"
      WECHAT_BOT_SERVICE_URL: https://example.invalid/bot
      WECHAT_BOT_INTERNAL_TOKEN: synthetic-ci-token
      WECHAT_PARENT_INVITATION_URL: https://example.invalid/invite
      WECHAT_OFFICIAL_ACCOUNT_QR_URL: https://example.invalid/qr
      WECHAT_ACCESS_TOKEN_URL: https://example.invalid/token
      WECHAT_CUSTOMER_MESSAGE_URL: https://example.invalid/message
    defaults:
      run:
        working-directory: studybuddy-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: studybuddy-backend/requirements.txt
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fonts-wqy-microhei
      - run: python -m pip install -r requirements.txt
      - run: python scripts/init_db.py
      - run: python -m pytest -q -rs -o addopts=''
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studybuddy-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.2"
          cache: npm
          cache-dependency-path: studybuddy-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
